name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Format check
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.go | ForEach-Object { $_.FullName }
          gofmt -w $files
          if (git status --porcelain) { git diff; throw "gofmt changes required" }
      - name: Test
        run: go test ./...
      - name: Build Windows executable
        run: go build -trimpath -o cherrycctv.exe ./cmd/cherrycctv
