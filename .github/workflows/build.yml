name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Format sources
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.go | ForEach-Object { $_.FullName }
          gofmt -w $files
      - name: Test
        run: go test ./...
      - name: Build Windows executable
        run: go build -trimpath -o cherrycctv.exe ./cmd/cherrycctv
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item cherrycctv.exe dist\
          Copy-Item config.example.json dist\config.json
          Copy-Item mediamtx.yml dist\
          Copy-Item scripts\install.ps1 dist\
          Compress-Archive -Path dist\* -DestinationPath cherry-desktop-cctv-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: cherry-desktop-cctv-windows
          path: cherry-desktop-cctv-windows.zip
