name: build

on:
  push:
    branches: [main, production-ready]
  pull_request:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Module graph check
        shell: pwsh
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Format check
        shell: pwsh
        run: |
          $bad = Get-ChildItem -Recurse -Filter *.go | ForEach-Object { gofmt -l $_.FullName }
          if ($bad) { $bad; throw "gofmt required" }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Build Windows executable
        run: go build -trimpath -ldflags "-s -w -X main.version=${{ github.sha }}" -o cherrycctv.exe ./cmd/cherrycctv
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\scripts | Out-Null
          Copy-Item cherrycctv.exe dist\
          Copy-Item config.example.json dist\
          Copy-Item mediamtx.yml dist\
          Copy-Item README.md dist\
          Copy-Item docs\PRODUCTION.md dist\PRODUCTION.md
          Copy-Item scripts\*.ps1 dist\scripts\
          Get-FileHash -Algorithm SHA256 dist\cherrycctv.exe | ForEach-Object { "$($_.Hash.ToLower())  cherrycctv.exe" } | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Compress-Archive -Path dist\* -DestinationPath cherry-desktop-cctv-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: cherry-desktop-cctv-windows
          path: cherry-desktop-cctv-windows.zip
          if-no-files-found: error
          retention-days: 30
